name: Security Scan

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start lab
        run: |
          mkdir -p reports && chmod 777 reports
          docker compose up -d --build
          sleep 30

      - name: Run Nmap scan
        run: docker exec kali-scanner nmap -Pn -p 3000 --script http-title,http-headers juice-shop -oN /reports/nmap.txt

      - name: Run Nikto scan
        run: docker exec kali-scanner nikto -h http://juice-shop:3000 -maxtime 120s -o /reports/nikto.txt -Format txt

      - name: Run OWASP ZAP baseline scan
        run: |
          docker run --rm --network devsecops-kali-lab_default -v ${{ github.workspace }}/reports:/zap/wrk:rw -u root ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://juice-shop:3000 -r zap-report.html -I

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: scan-reports
          path: reports/

      - name: Stop lab
        if: always()
        run: docker compose down
